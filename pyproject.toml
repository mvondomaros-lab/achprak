[project]
name = "achprak"
version = "0.4.3"
authors = [{ name = "Michael von Domaros", email = "mvondomaros@uni-marburg.de" }]
description = "Web-based practical introducing theoretical chemistry to first-year chemistry students"
readme = "README.md"
license = { file = "LICENSE" }

[tool.setuptools.package-data]
"achprak.web" = ["static/*", "static/vendor/*"]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"

numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.8,<4"

ase = ">=3.28.0,<4"
rdkit = ">=2026.3.1,<2027"
tblite-python = ">=0.5.0,<0.6"
mopac = ">=23.2.4,<24"

[tool.pixi.pypi-dependencies]
achprak = { path = ".", editable = true }
sella = ">=2.4.2, <3"
pymopac = ">=1.1, <2"

[tool.pixi.feature.dev.dependencies]
httpx = ">=0.28,<1"
pytest = ">=9.0.3,<10"
pixi-pycharm = ">=0.0.11,<0.0.12"
mystmd = ">=1.8.3,<2"
pre-commit = ">=4.5.1,<5"

[tool.pixi.feature.web.dependencies]
fastapi = ">=0.115,<1"
uvicorn = ">=0.34,<1"

[tool.pixi.feature.web.tasks]
web = "python -m achprak.web"

[tool.pixi.feature.web-hub.dependencies]
jupyterhub = ">=5.4.4,<6"
configurable-http-proxy = ">=4.6,<6"

[tool.pixi.feature.web-hub.pypi-dependencies]
jupyter-server-proxy = { version = ">=4.4,<5", extras = ["standalone"] }

[tool.pixi.feature.dev.tasks]
test-web = "pytest tests -q"
test-ts = "ACHPRAK_TS_TESTS=1 pytest tests -m ts_optimization -q"

[tool.pytest.ini_options]
markers = ["ts_optimization: opt-in real minimum-to-TS optimization regression set"]

[tool.pixi.environments]
dev = { features = ["web", "dev"] }
web = { features = ["web"] }
web-hub = { features = ["web", "web-hub"] }
